<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canh Duc Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="logo" href="#hero">Canh Duc Portfolio</a>
        <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="#about">About</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="hero" class="section hero">
        <div class="container hero-card" id="hero-content"></div>
      </section>

      <section id="about" class="section">
        <div class="container" id="about-content"></div>
      </section>

      <section id="projects" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Projects</h2>
            <p id="projects-intro"></p>
          </div>
          <div class="grid" id="projects-grid"></div>
        </div>
      </section>

      <section id="skills" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Skills</h2>
            <p id="skills-intro"></p>
          </div>
          <div class="skills" id="skills-list"></div>
        </div>
      </section>

      <section id="contact" class="section">
        <div class="container" id="contact-content"></div>
      </section>
    </main>

    <footer class="footer">
      <p id="footer-text"></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
